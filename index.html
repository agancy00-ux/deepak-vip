    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Updated Background: Premium Obsidian Dark with subtle glowing ambiance */
            background: radial-gradient(circle at center, #18181b 0%, #09090b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(24, 24, 27, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .telegram-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #2AABEE 0%, #229ED9 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 25px rgba(34, 158, 217, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        .telegram-logo svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        p {
            font-size: 15px;
            color: #a1a1aa;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .benefits {
            text-align: left;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .benefit-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #e4e4e7;
        }

        .benefit-item:last-child {
            margin-bottom: 0;
        }

        .benefit-item span {
            color: #229ED9;
            margin-right: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        /* Dynamic Animated Button */
        .cta-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #2AABEE 0%, #229ED9 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(34, 158, 217, 0.5);
            transition: all 0.3s ease;
            animation: pulseGlow 2s infinite;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(34, 158, 217, 0.7);
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 158, 217, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(34, 158, 217, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(34, 158, 217, 0);
            }
        }

        .secure-text {
            font-size: 12px;
            color: #71717a;
            margin-top: 15px;
        }
    </style>
</head>

        <h1>Join Our Exclusive Telegram Channel</h1>

            <div class="benefit-item"><span>✓</span> 100% Free Community Access</div>
            <div class="benefit-item"><span>✓</span> Daily Real-time Updates & Signals</div>
